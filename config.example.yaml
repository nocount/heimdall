# heimdall config. Installed at /etc/heimdall/config.yaml (root:heimdall, 0640).
# For development, copy to config.local.yaml and point HEIMDALL_CONFIG at it.

timezone: America/Los_Angeles
focus_windows:
  - days: [mon, tue, wed, thu, fri]
    start: "09:00"
    end: "17:00"

# Shadow mode: always serve "allow", but log the would-be verdict (Phase 1).
# false enforces: blocked pages redirect to the block page (Phase 2).
shadow: false

# Dev only: true/false overrides the schedule, null follows it.
force_focus: null

db_path: /var/lib/heimdall/heimdall.db

classifier:
  provider: openrouter          # workers_ai | openrouter | local_llamacpp
  model: "typesafe/jev-1.13"
  timeout_ms: 1500              # Jev p99 was ~1.2s in the Phase 0 bench
  # One question per video (questions.py). Phase 0 (2026-10-23): with the
  # channel allowlist below, 0.78 kept 20/23 allow labels with 1/173 false
  # allows (leave-one-out estimate: 20/23 with 4 false allows).
  thresholds: { worth_learning: 0.78 }
  # Optional `fallback:` (provider, model, timeout_ms, thresholds) is asked
  # when the primary fails. Left out: if OpenRouter is down, YouTube fails
  # closed. Keep primary + fallback timeouts under the extension's 3s.

appeals:                        # Phase 2; not used yet
  model: claude-haiku-5-5
  min_words: 8
  max_per_day: 5
  deny_cooldown_min: 10
  max_grant_min: 40

rules:
  youtube:
    block_paths: ["/", "/shorts/*", "/feed/*"]
    # Videos from these channels are allowed without a model call. Channel
    # IDs (UC...), not names, which lookalike channels can copy. Find an ID
    # in a decision's metadata (`heimdall review --list`) or the channel page.
    allow_channels: []
    #  - UCxxxxxxxxxxxxxxxxxxxxxx   # Channel name
  # Blocked outright during focus hours; an appeal grants one post, profile
  # or search (by ID) for a while. X isn't sent to the classifier.
  hard_block_domains: [x.com, twitter.com]   # add other time sinks, e.g. reddit.com
  always_allow_domains: []

cache_ttl_days: { youtube: 30 }

watchdog:                       # Phase 3; not used yet
  heartbeat_timeout_s: 60
  startup_grace_s: 90
  kill_browsers: [chromium, chrome, google-chrome, brave, vivaldi, opera, epiphany]
