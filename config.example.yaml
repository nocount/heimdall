# heimdall config. Installed at /etc/heimdall/config.yaml (root:heimdall, 0640).
# For development, copy to config.local.yaml and point HEIMDALL_CONFIG at it.

timezone: America/Los_Angeles
focus_windows:
  - days: [mon, tue, wed, thu, fri]
    start: "09:00"
    end: "17:00"

# Shadow mode: always serve "allow", but log the would-be verdict. Phase 1.
shadow: true

# Dev only: true/false overrides the schedule, null follows it.
force_focus: null

db_path: /var/lib/heimdall/heimdall.db

classifier:
  provider: openrouter          # workers_ai | openrouter | local_llamacpp
  model: "typesafe/jev-1.13"
  timeout_ms: 1500              # Jev p99 was 976ms in the Phase 0 bench
  # Phase 0 (2026-10-23): at 0.81, Jev kept 7/10 allow labels with 0/143
  # false allows. YouTube is judged on `educational` alone.
  thresholds: { educational: 0.81, ai_related: 0.7 }
  # Used when the primary errors or times out. A different provider, so an
  # OpenRouter outage doesn't fail everything closed. Models aren't
  # calibrated alike, so it carries its own thresholds (Clef: 0.76 kept 5/10
  # with 0 false allows). Primary + fallback timeouts stay under the
  # extension's 3s request timeout. For a local fallback instead:
  #   provider: local_llamacpp, model: clef-flash, url: http://127.0.0.1:8081
  # (re-bench it first; a quantized GGUF may not match Workers AI's scores).
  fallback:
    provider: workers_ai
    model: "@cf/cloudflare/clef-flash"
    timeout_ms: 1200
    thresholds: { educational: 0.76, ai_related: 0.7 }

appeals:                        # Phase 2; not used yet
  model: claude-haiku-5-5
  min_words: 8
  max_per_day: 5
  deny_cooldown_min: 10
  max_grant_min: 40

rules:
  youtube:
    block_paths: ["/", "/shorts/*", "/feed/*"]
  x:
    block_paths: ["/home", "/explore", "/explore/*", "/notifications", "/notifications/*", "/i/lists/*"]
  hard_block_domains: []        # e.g. [reddit.com]
  always_allow_domains: []

cache_ttl_days: { youtube: 30, x: 1 }

watchdog:                       # Phase 3; not used yet
  heartbeat_timeout_s: 60
  startup_grace_s: 90
  kill_browsers: [chromium, chrome, google-chrome, brave, vivaldi, opera, epiphany]
